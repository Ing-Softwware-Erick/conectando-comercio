<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>Nuevo Producto</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item>
      <ion-label position="stacked">Nombre del producto *</ion-label>
      <ion-input [(ngModel)]="producto.nombre" placeholder="Ej: Camisa de algodón"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Precio *</ion-label>
      <ion-input [(ngModel)]="producto.precio" type="number" placeholder="0"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Descripción</ion-label>
      <ion-textarea [(ngModel)]="producto.descripcion" placeholder="Describe tu producto..."></ion-textarea>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Especificaciones (Talla, color, etc.)</ion-label>
      <ion-input [(ngModel)]="producto.especificaciones" placeholder="Opcional"></ion-input>
    </ion-item>
  </ion-list>

  <div class="ion-padding">
    <h3>Formas de Entrega (Elige al menos una) *</h3>
    
    <ion-item lines="none">
      <ion-checkbox slot="start" (ionChange)="toggleEntrega('domicilio', $event)"></ion-checkbox>
      <ion-label>Domicilio</ion-label>
    </ion-item>
    <ion-item lines="none">
      <ion-checkbox slot="start" (ionChange)="toggleEntrega('tienda', $event)"></ion-checkbox>
      <ion-label>Tienda física</ion-label>
    </ion-item>
    <ion-item lines="none">
      <ion-checkbox slot="start" (ionChange)="toggleEntrega('publico', $event)"></ion-checkbox>
      <ion-label>Reclamar en lugar público</ion-label>
    </ion-item>
  </div>

  <div class="ion-padding ion-text-center">
    <h3>Fotografía del producto</h3>
    <input type="file" accept="image/*" (change)="cargarImagen($event)" style="display: none;" #fileInput>
    
    <ion-button expand="block" (click)="fileInput.click()">
      <ion-icon slot="start" name="camera-outline"></ion-icon>
      Seleccionar o Tomar Foto
    </ion-button>

    <ion-img *ngIf="producto.imagen" [src]="producto.imagen" class="ion-margin-top" style="max-height: 200px; object-fit: contain;"></ion-img>
  </div>

  <ion-button expand="block" class="ion-margin-top" (click)="guardarProducto()">
    <ion-icon slot="start" name="save-outline"></ion-icon>
    Guardar Producto
  </ion-button>
</ion-content>

<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Conectando Comercio</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="ion-text-center ion-margin-bottom">
    <h2>Panel Principal</h2>
    <p>¿Qué deseas hacer hoy?</p>
  </div>

  <ion-grid>
    <ion-row>
      <ion-col size="6">
        <ion-card routerLink="/nuevo-producto" button>
          <ion-card-header class="ion-text-center">
            <ion-icon name="add-circle-outline" size="large" color="primary"></ion-icon>
            <ion-card-title style="font-size: 1rem; margin-top: 10px;">Nuevo Producto</ion-card-title>
          </ion-card-header>
        </ion-card>
      </ion-col>
      
      <ion-col size="6">
        <ion-card routerLink="/mis-productos" button>
          <ion-card-header class="ion-text-center">
            <ion-icon name="list-outline" size="large" color="secondary"></ion-icon>
            <ion-card-title style="font-size: 1rem; margin-top: 10px;">Mis Productos</ion-card-title>
          </ion-card-header>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>

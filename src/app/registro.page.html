<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Registro de Comerciante</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="ion-text-center ion-margin-bottom">
    <h2>Conectando Comercio</h2>
    <p>Registra los datos de tu negocio para empezar</p>
  </div>

  <ion-list>
    <ion-item>
      <ion-label position="floating">Nombre del Negocio *</ion-label>
      <ion-input [(ngModel)]="comerciante.nombreNegocio" type="text"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Nombre del Responsable</ion-label>
      <ion-input [(ngModel)]="comerciante.nombreResponsable" type="text"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Teléfono de Contacto *</ion-label>
      <ion-input [(ngModel)]="comerciante.telefono" type="tel"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Correo Electrónico</ion-label>
      <ion-input [(ngModel)]="comerciante.correo" type="email"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Documento de Verificación</ion-label>
      <ion-input [(ngModel)]="comerciante.documento" type="text"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Información de Pago (Nequi, Daviplata, etc.)</ion-label>
      <ion-input [(ngModel)]="comerciante.infoPago" type="text"></ion-input>
    </ion-item>
  </ion-list>

  <ion-button expand="block" class="ion-margin-top" (click)="guardar()">
    Guardar y Continuar
  </ion-button>
</ion-content>
